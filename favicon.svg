<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hands cradling the earth with a tree growing from it">
  <defs>
    <linearGradient id="f-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB0E8"/><stop offset="1" stop-color="#1C69AC"/>
    </linearGradient>
    <linearGradient id="f-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBDCBC"/><stop offset="1" stop-color="#E4AE81"/>
    </linearGradient>
    <clipPath id="f-globe"><circle cx="32" cy="42" r="15"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#0D3B2A"/>

  <!-- trunk, then canopy over it -->
  <path d="M29.8 32 C29.4 26 28.8 22 28.2 18 C27.4 13 30 10.5 32 10.5 C34 10.5 36.6 13 35.8 18
           C35.2 22 34.6 26 34.2 32 Z" fill="#7A4A28"/>
  <g fill="#2F7A3A">
    <circle cx="32" cy="14" r="11"/><circle cx="21" cy="19" r="7.5"/><circle cx="43" cy="19" r="7.5"/>
    <circle cx="25" cy="8.5" r="6"/><circle cx="39" cy="8.5" r="6"/>
  </g>
  <g fill="#52B24B">
    <circle cx="32" cy="15" r="8.5"/><circle cx="23.5" cy="19.5" r="5.5"/><circle cx="40.5" cy="19.5" r="5.5"/>
    <circle cx="27" cy="10" r="4.5"/><circle cx="37" cy="10" r="4.5"/>
  </g>
  <g fill="#7ED169">
    <circle cx="29" cy="12" r="4"/><circle cx="36.5" cy="16" r="3.2"/><circle cx="23.5" cy="16.5" r="2.6"/>
  </g>

  <!-- palm bowl, behind the globe -->
  <path d="M11 44 C12 56 20 62 32 62 C44 62 52 56 53 44 C49 51 42 54 32 54 C22 54 15 51 11 44 Z"
        fill="url(#f-skin)"/>

  <!-- globe -->
  <circle cx="32" cy="42" r="15" fill="url(#f-sea)"/>
  <g clip-path="url(#f-globe)">
    <g fill="#5FBE55">
      <path d="M18 35 C23 31 29 34 27 39 C25 44 18 45 15 41 Z"/>
      <path d="M35 29 C42 27 48 31 47 37 C46 42 41 44 38 49 C36 54 33 57 30 55 C27 53 28 47 30 41 C31 35 32 30 35 29Z"/>
      <path d="M22 48 C26 46 28 51 27 57 L20 57 C19 53 20 49 22 48Z"/>
    </g>
    <g fill="none" stroke="#7A4A28" stroke-width="1.5" stroke-linecap="round">
      <path d="M31 28 C28 30 26 32 25 35"/><path d="M33 28 C36 30 38 32 39 35"/>
      <path d="M32 28 C32 31 32 33 32 36"/>
    </g>
  </g>
  <circle cx="32" cy="42" r="15" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- fingers -->
  <g fill="url(#f-skin)" stroke="#C98B5E" stroke-width=".6">
    <rect x="-2.7" y="-13" width="5.4" height="15.7" rx="2.7" transform="translate(42 46.6) rotate(25)"/>
    <rect x="-2.8" y="-14" width="5.6" height="16.8" rx="2.8" transform="translate(39 50.4) rotate(50)"/>
    <rect x="-2.6" y="-12" width="5.2" height="14.6" rx="2.6" transform="translate(35.4 52.5) rotate(72)"/>
    <rect x="-2.7" y="-13" width="5.4" height="15.7" rx="2.7" transform="translate(22 46.6) rotate(-25)"/>
    <rect x="-2.8" y="-14" width="5.6" height="16.8" rx="2.8" transform="translate(25 50.4) rotate(-50)"/>
    <rect x="-2.6" y="-12" width="5.2" height="14.6" rx="2.6" transform="translate(28.6 52.5) rotate(-72)"/>
  </g>
</svg>
